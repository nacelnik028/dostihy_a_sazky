# Nasazení hry na GitHub Pages.
# Firebase konfigurace (API klíč) není v repozitáři. Bere se z tajemství
# FIREBASE_CONFIG (Settings → Secrets and variables → Actions) a soubor
# js/firebase-config.js vznikne až při sestavení webu.
name: Nasazení na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Sestavit web s Firebase konfigurací
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -z "$FIREBASE_CONFIG" ]; then
            echo "::error::Chybí tajemství FIREBASE_CONFIG (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf '%s' "$FIREBASE_CONFIG" | node -e '
            const c = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (!c || !c.apiKey || !c.databaseURL) {
              console.error("::error::FIREBASE_CONFIG musí být JSON s apiKey a databaseURL.");
              process.exit(1);
            }
          '
          mkdir -p _site
          cp -r index.html css js _site/
          rm -f _site/js/firebase-config.example.js
          printf 'export const firebaseConfig = %s;\n' "$FIREBASE_CONFIG" > _site/js/firebase-config.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
